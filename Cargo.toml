# dig-peer-selector — the self-optimizing peer-selection middleware of the DIG Node.
#
# The selector is a pure DECISION + LEARNING layer. It sits between `dig-download` (the executor that
# fetches bytes over dig-nat mTLS) and the peer-discovery layers (`dig-dht`, `dig-gossip`/`dig-pex`,
# `dig-nat`), and answers one question — "of these candidate peers, which subset should serve this
# content, and in what order?" — learning the answer from the REAL, MEASURED outcome of every transfer
# it influenced. It opens no socket, runs no discovery, and exposes NO user-facing behavior knobs
# (SPEC.md §1.5): every tradeoff (saturation point, relayed penalty, decay) is self-tuned from
# observed data.
#
# Dependency philosophy (mirrors dig-dht / dig-pex): keep the tree SMALL. The selector re-uses the
# transport-verified peer identity (`peer_id = SHA-256(TLS SPKI DER)`) and the candidate/content types
# from the sibling crates rather than redefining parallel copies (SPEC.md §5, §11):
#   - `dig-nat`  → `PeerId`, `TraversalKind` (the connection class it reads, observationally).
#   - `dig-dht`  → `ContentId`, `ProviderRecord`, `CandidateAddr`, `AddressKind` (the candidate feed).
#   - `dig-gossip` → `PoolEvent` / `PoolRemovalReason` (the topology/churn feed, consumed VERBATIM per
#     SPEC §5.4 — the selector MUST NOT redefine the event type).
# It deliberately does NOT depend on `dig-download` for types the loop expresses structurally
# (`TransferOutcome`/`Selection` are defined here), so there is no dependency cycle — the
# DownloadEvent→record_outcome mapping lives in the host adapter (dig-node), not this crate (SPEC §11).
#
# Sourcing: all DIG dependencies below resolve from crates.io (never `git` — cargo publish rejects a
# git dependency), per the ecosystem's all-crates-on-crates.io rule (CLAUDE.md §3.6/#1216).
#
# `dig-nat` 0.6.0 cut a HARD self-signed→CA-signed mTLS cutover: it dropped its own
# `LocalIdentity`/`build_bound_cert`/`cert_binding` surface in favor of re-exporting `dig-tls`'s
# `NodeCert`-based identity model. This crate never called any of that removed surface — it only
# reads `PeerId`/`TraversalKind` as pure, connection-agnostic VALUE types (SPEC §1.3, §7.3) — so the
# 0.6.0 bump needed no code migration beyond the version pin.
#
# `dig-nat` 0.7.0 is purely ADDITIVE over 0.6 (adds `connect_with_runtime`/`NatRuntime` for the full
# NAT ladder; the 3-arg `connect` and every type this crate reads are unchanged) — a mechanical
# version-pin bump, no code migration (#836).
#
# `dig-dht` 0.2.0 (the latest published version at the time of this bump) has NOT yet migrated to
# `dig-nat` 0.6 — it still resolves `dig-nat ^0.3`, so cargo unifies TWO distinct `dig-nat` majors in
# this crate's graph (0.3.x via dig-dht, 0.6.0 direct). `ProviderRecord::provider_peer_id()` (a
# dig-dht convenience method) therefore returns dig-dht's OLDER `dig_nat::PeerId`, a different Rust
# type from ours. `Candidate::from_provider_record` avoids the mismatch by decoding the record's raw
# `provider_peer_id` hex FIELD directly via this crate's own `dig_nat::PeerId::from_hex` — `PeerId` is
# a pure 32-byte-hex value, so this is exact and version-independent. When `dig-dht` publishes a
# `dig-nat 0.6`-compatible release, this crate can revert to the convenience method (not required —
# either form is correct).
#
# `dig-nat` 0.8.0 (STUN happy-eyeballs reflexive discovery, §5.2) is purely ADDITIVE over 0.7 — a new
# discovery entry point only, every type this crate reads (`PeerId`, `TraversalKind`) is unchanged — a
# mechanical version-pin bump, no code migration.
#
# `dig-dht` 0.3.0 has the SAME public API as 0.2.2 — its 0.3.0 was itself just a `dig-nat` dependency
# bump (to stay in lockstep with the 0.8.0 cutover above), not a behavior change. Bumping both together
# unifies the final dependency tree on ONE `dig-nat` version (the split-major situation described above
# is resolved by this bump — both this crate and `dig-dht` now agree on `dig-nat 0.8`), so
# `ProviderRecord::provider_peer_id()` and the raw-hex decode path in `Candidate::from_provider_record`
# now return the SAME `PeerId` type; the raw-hex path is kept as-is since it remains correct either way.
#
# This crate's public API re-exports the bumped `dig-nat`/`dig-dht` types, so the dependency bump is
# breaking FOR CONSUMERS even though it's additive for us — hence the 0.2.1 -> 0.3.0 release (0.x
# minor-position bump signals the breaking change per SemVer's 0.x convention).
#
# `dig-nat` 0.10.0 + `dig-dht` 0.5.0 (release-first cascade #1494) — this crate now depends on `dig-nat`
# directly AND transitively (via `dig-dht`, itself rebased onto `dig-nat` 0.10) at the SAME version, so
# the historical split-major situation this file narrates above (two coexisting `dig_nat::PeerId` Rust
# types, worked around via the raw-hex decode path) is now fully and permanently unified: both routes —
# this crate's own `dig_nat::PeerId` and `ProviderRecord::provider_peer_id()`'s return type — resolve to
# the ONE `dig-nat` 0.10 `PeerId`. Both API surfaces this crate reads (`PeerId`, `TraversalKind` from
# dig-nat; `ContentId`/`ProviderRecord`/`CandidateAddr`/`AddressKind` from dig-dht) are unchanged by
# either bump, so this is a mechanical version-pin bump + re-export propagation, not a scoring/decision
# logic change — hence the 0.4.2 -> 0.5.0 release (0.x minor-position bump signals the breaking-for-
# consumers re-export change per SemVer's 0.x convention, same reasoning as the 0.3.0 bump above).
#
# `dig-nat` 0.11.0 + `dig-dht` 0.5.1 (release-first cascade #1550, unblocking #1532 Leg B / #1062) —
# dig-nat 0.11 is purely ADDITIVE over 0.10 (a new relay-accept path), and dig-dht 0.5.1 is itself just
# the dig-nat ^0.11 dependency bump. Both API surfaces this crate reads are unchanged, so this remains a
# mechanical version-pin bump with no scoring/decision logic change — a 0.5.1 -> 0.5.2 patch release.
#
# `dig-nat` 0.13.0 + `dig-dht` 0.7.0 (release-first cascade #1656, unblocking P0 #1640 — dig-nat capped
# framing DECODE at 64 KiB but not ENCODE, so every DIG read/reshare above ~48 KiB failed to decode).
# Both previous requirements were UNRESOLVABLE, not merely old: a `0.x` minor is semver-incompatible, so
# `dig-nat = "0.11"` means `>=0.11,<0.12` and `dig-dht = "0.5.1"` means `>=0.5.1,<0.6` — neither could
# ever reach the published 0.13.0 / 0.7.0. The crate was stranded, and the framing fix could not arrive.
#
# No code migration was required, and this was verified rather than assumed: dig-nat 0.12 made the mux
# wire types (`RangeFrame`, `RangeRequest`, `Availability*`) `#[non_exhaustive]` with a fallible
# `encode()`, and this crate constructs or encodes NONE of them — it reads only `PeerId` +
# `TraversalKind` as pure connection-agnostic value types (SPEC §1.3, §7.3). dig-dht 0.6 was purely
# additive over 0.5.1 and its 0.7.0 was itself just the dig-nat ^0.13 bump, so the candidate-feed
# surface (`ContentId`/`ProviderRecord`/`CandidateAddr`/`AddressKind`) is unchanged.
#
# Released as 0.5.2 -> 0.6.0 (breaking, per SemVer's 0.x minor-position convention) because the bumped
# types are DEP-OWNED and re-exported from this crate's public API: `TraversalKind` is defined in dig-nat
# itself (`src/method/mod.rs`), and all four candidate-feed types are defined in dig-dht itself
# (`src/content.rs`, `src/record.rs`). A consumer holding a dig-dht 0.5.x `ContentId` therefore cannot
# pass it to this crate any more. `PeerId` is the one exception — it is DEFINED in `dig-tls`
# (`identity.rs`) and merely re-exported through dig-nat, and both dig-nat versions agree on
# `dig-tls ^0.3`, so cargo unifies it and that re-export alone would not have been breaking. Resolving
# each re-export to its defining crate — not reading the re-export list — is what makes this call honest.
#
# `dig-nat` 0.14.0 + `dig-dht` 0.8.0 (release-first cascade #1686) — the SECOND, unavoidable hop of the
# same cascade, because 0.6.0 above was cut onto `^0.13`/`^0.7` before dig-nat 0.14 existed. A `0.x`
# minor is semver-INCOMPATIBLE (`"0.13"` means `>=0.13.0, <0.14.0`), so those requirements could never
# resolve 0.14.0/0.8.0 — and while this crate stayed on them, dig-node's tree resolved TWO `dig-nat` and
# TWO `dig-dht` versions and failed to compile with `expected dig_nat::relay::RelayStatus, found
# dig_nat::RelayStatus`. For a `0.x` dep bump, EVERY node on EVERY path from the dep to the final
# consumer must be bumped; one un-bumped node forces duplicate resolution for the whole graph.
#
# No code migration was required, and this was VERIFIED at the published sources rather than assumed:
# `dig-nat` 0.14.0 is purely additive over 0.13.0 (its public identifier set gains exactly
# `ChunkLensAssembler`, `ChunkLensError`, `MAX_RESOURCE_CHUNK_COUNT` plus a new `RangeFrame` method, and
# loses nothing), and `dig-dht` 0.8.0's `src/` is BYTE-IDENTICAL to 0.7.0's — a manifest-only release
# carrying just its own `dig-nat = "0.14"` bump. Both surfaces this crate reads are untouched.
#
# Released as 0.6.0 -> 0.7.0 (breaking, per SemVer's 0.x minor-position convention) on the same
# type-ownership rule as the 0.6.0 bump, re-derived against the 0.14.0/0.8.0 sources rather than
# inherited: a dep bump over a re-exporting crate is breaking IFF the re-exported type is dep-OWNED.
# Five of the six types this crate re-exports are dep-owned and therefore change identity for consumers:
# `TraversalKind` is defined in dig-nat (`src/method/mod.rs`), and `ContentId` (`src/content.rs`) plus
# `AddressKind` / `CandidateAddr` / `ProviderRecord` (all three in `src/record.rs`) are defined in
# dig-dht. `PeerId` remains the one exception — it is defined in `dig-tls` (`src/identity.rs`) and merely
# re-exported through dig-nat, and dig-nat 0.13 and 0.14 BOTH require `dig-tls = "0.3"`, so cargo unifies
# it and `PeerId` alone would have justified only a patch.
#
# 0.7.0 -> 0.8.0 (dig-nat 0.15 / dig-dht 0.9, the SafeText peer-text cascade #1674/#1675) repeats that
# reasoning for the same reason, and it is again mandatory rather than cosmetic: `dig-nat = "0.14"`
# (`>=0.14.0, <0.15.0`) can never resolve 0.15.0, and this crate was the LAST node on the path from
# dig-nat to dig-node still holding the 0.14 line. While it did, dig-node's tree resolved TWO dig-nat
# and TWO dig-dht versions — verified directly in dig-node's lock, where `cargo tree -i dig-nat@0.14.1`
# named `dig-peer-selector v0.7.0` as the sole remaining source of both duplicates.
#
# No code migration was required, and this too was verified at the sources rather than assumed. The
# change in both deps is confined to their ERROR surfaces: dig-nat 0.15.0 adds `safe_text.rs` and
# rewrites `error.rs` so error text is carried as `SafeText` instead of `String`, and dig-dht 0.9.0
# follows suit in its own `error.rs`/`transport.rs`/`wire.rs`. This crate names neither `NatError` nor
# `DhtError` nor `SafeText` anywhere in `src/` — it is a pure decision layer over already-observed
# outcomes, not a caller of either transport — so the one surface that changed is a surface it does not
# read.
#
# Released as a breaking 0.x minor on the unchanged type-ownership rule: the re-exported `TraversalKind`
# (dig-nat) and `ContentId` / `AddressKind` / `CandidateAddr` / `ProviderRecord` (dig-dht) are dep-OWNED,
# so a dep-version change rotates their identity for this crate's consumers even though no line of this
# crate's own logic moved.
[package]
name = "dig-peer-selector"
version = "0.9.1"
edition = "2021"
rust-version = "1.75.0"
license = "Apache-2.0 OR MIT"
description = "Self-optimizing peer-selection middleware for the DIG Node — the pure decision + learning layer between dig-download and the discovery layers (dig-dht / dig-gossip / dig-nat). Maintains a dynamic peer registry, learns each peer's throughput/RTT/reliability + saturation point + a relayed penalty from the REAL measured outcome of every transfer (measured-only, non-gameable), and ranks a candidate subset per content request to minimize P99 latency without thundering-herd. No user-facing knobs; re-uses the transport-verified peer_id = SHA-256(TLS SPKI DER)."
repository = "https://github.com/DIG-Network/dig-peer-selector"
readme = "README.md"
keywords = ["p2p", "peer-selection", "download", "scheduling", "dig"]
categories = ["network-programming"]

[dependencies]
# Peer identity (peer_id = SHA-256(TLS SPKI DER)) + the connection-class ladder (`TraversalKind`) the
# selector reads observationally to seed class/relay priors. Re-used, never redefined (SPEC §1.3, §7.3).
dig-nat = "0.20"

# The candidate feed: `ContentId` (what is fetched), `ProviderRecord` / `CandidateAddr` / `AddressKind`
# (the DHT provider records mapped into candidates). Re-used, never redefined (SPEC §7.1, §11).
dig-dht = "0.12"

# Read-only observability snapshots (§5.7) serialize for the agent-friendly/machine-consumable surface.
serde = { version = "1", features = ["derive"] }

# Deterministic, seedable exploration tie-breaks (SPEC §4.4-F). A small, self-seeded PRNG keeps the
# harness reproducible; no OS entropy is used so `select` stays pure + testable.
rand = "0.8"
rand_pcg = "0.3"

[dev-dependencies]
# The synthetic-topology + throughput-trace conformance harness (SPEC §8) runs entirely in-process
# with a deterministic injected clock — NO real network, NO async runtime needed.
#
# `serde_json` verifies the read-only observability snapshots (§5.7) serialize for the
# machine-consumable/agent-friendly surface.
serde_json = "1"

[profile.release]
overflow-checks = true
